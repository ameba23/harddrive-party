image: "rust:latest"

default:
  before_script:
    - rustc --version
    - cargo --version

stages:
  - test

test-code:
  stage: test
  script:
    - cargo test
    - rustup component add clippy
    - cargo clippy -- -D warnings
    - rustup component add rustfmt
    - cargo fmt -- --check
  only:
    - main

test-web-ui:
  stage: test
  script:
    - apt-get update
    - apt-get install -y firefox-esr wget tar
    - wget -qO /tmp/geckodriver.tar.gz https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz
    - tar -xzf /tmp/geckodriver.tar.gz -C /usr/local/bin
    - chmod +x /usr/local/bin/geckodriver
    - rustup target add wasm32-unknown-unknown
    - version=$(awk 'BEGIN { found = 0 } /^name = "wasm-bindgen"$/ { found = 1; next } found && /^version = / { gsub(/"/, "", $3); print $3; exit }' web-ui/Cargo.lock)
    - cargo install --locked --force wasm-bindgen-cli --version "$version"
    - cargo check --locked --manifest-path web-ui/Cargo.toml --features mock-ui
    - cargo test --locked --manifest-path web-ui/Cargo.toml --target wasm32-unknown-unknown --lib
